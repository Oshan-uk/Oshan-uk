<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0057FF"/>
      <stop offset="1" stop-color="#00FFF0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00B4FF" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="896" height="356" rx="14" fill="url(#body)" stroke="url(#ac)" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="356" rx="14" fill="url(#grid)"/>
  <path d="M2 16 a14 14 0 0 1 14 -14 H884 a14 14 0 0 1 14 14 V44 H2 Z" fill="#0f1b38"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="24" r="7" fill="#27c93f"/>
  <text x="450" y="29" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6aa7c9">oshan@ijse: ~/about-me</text>

  <g font-family="'Courier New', monospace" font-size="18">
    <g>
      <text x="30" y="82"><tspan fill="#27c93f">oshan@dev</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#00B4FF">~</tspan><tspan fill="#ffffff">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
      <set attributeName="opacity" to="0" begin="0s" dur="0.3s"/>
    </g>
    <g opacity="0">
      <text x="30" y="112" fill="#00FFF0">Oshan Udeesha | Software Engineering Student</text>
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="30" y="150"><tspan fill="#27c93f">oshan@dev</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#00B4FF">~</tspan><tspan fill="#ffffff">$ </tspan><tspan fill="#e6edf3">cat status.json</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="30" y="180" fill="#e6edf3">{</text>
      <text x="56" y="206"><tspan fill="#00B4FF">"studying"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffd866">"Software Engineering @ IJSE"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="56" y="232"><tspan fill="#00B4FF">"learning"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffd866">["AI", "ML", "Full-Stack"]</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="56" y="258"><tspan fill="#00B4FF">"creating"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffd866">"CodeCraft with Oshan"</tspan><tspan fill="#e6edf3">,</tspan></text>
      <text x="56" y="284"><tspan fill="#00B4FF">"open_to"</tspan><tspan fill="#e6edf3">:  </tspan><tspan fill="#ffd866">"collabs, internships, OSS"</tspan></text>
      <text x="30" y="310" fill="#e6edf3">}</text>
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="30" y="344"><tspan fill="#27c93f">oshan@dev</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#00B4FF">~</tspan><tspan fill="#ffffff">$ </tspan><tspan fill="#00FFF0">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/>
    </g>
  </g>
</svg>
