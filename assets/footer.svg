<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#071633"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0057FF"/>
      <stop offset=".5" stop-color="#00B4FF"/>
      <stop offset="1" stop-color="#00FFF0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00B4FF" stroke-opacity=".09"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="160" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="160" fill="url(#bg)"/>
    <rect width="1200" height="160" fill="url(#grid)"/>
    <g fill="none" stroke="#00B4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
      <path d="M0 120 H200 L240 80 H420" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-220" dur="6s" repeatCount="indefinite"/></path>
      <path d="M1200 120 H1000 L960 80 H780" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-220" dur="6s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#00FFF0">
      <circle cx="420" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-weight="700" font-size="28" fill="url(#ac)">Thanks for stopping by!</text>
    <text x="600" y="106" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#7fc6e8">// keep building. keep learning. stay active with me.</text>
    <rect x="0" y="154" width="1200" height="6" fill="url(#ac)"/>
  </g>
</svg>
